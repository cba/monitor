# Monitor 配置文件

defaults:
  interval: 60
  alert_interval: 300

monitors:
  # HTTP/HTTPS 网址监控
  - name: 官网
    type: http
    url: https://example.com

  # TCP 端口监控
  - name: Redis服务
    type: tcp
    host: 192.168.1.100
    port: "6379"
    interval: 30
    alert_interval: 120

  # ICMP Ping 监控
  - name: 服务器存活
    type: icmp
    target: 192.168.1.1

  # ICMP Ping 监控（远程 - 通过 SSH 执行）
  - name: 远程服务器存活
    type: icmp
    target: 192.168.1.1
    ssh:
      user: root
      host: 192.168.1.100
      key_file: /root/.ssh/id_rsa
      enabled: false

  # HTTPS 证书监控
  - name: SSL证书
    type: ssl
    host: example.com
    port: "443"
    interval: 3600
    alert_interval: 86400

  # HTTP 关键字监控
  - name: 首页关键词
    type: keyword
    url: https://example.com
    keyword: Hello
    interval: 120
    alert_interval: 600

  # MySQL 监控
  - name: MySQL数据库
    type: mysql
    dsn: "user:password@tcp(127.0.0.1:3306)/mydb"

  # MySQL 监控（远程 - SSH 跳板机）
  - name: 远程MySQL
    type: mysql
    dsn: "user:password@tcp(10.0.0.5:3306)/mydb"
    ssh:
      user: root
      host: 192.168.1.100
      key_file: /root/.ssh/id_rsa
    enabled: false

  # Redis 监控
  - name: Redis服务
    type: redis
    host: 127.0.0.1
    port: "6379"
    interval: 30
    alert_interval: 120

  # Redis 监控（远程 - SSH 跳板机）
  - name: 远程Redis
    type: redis
    host: 10.0.0.5
    port: "6379"
    password: your_password
    ssh:
      user: root
      host: 192.168.1.100
      key_file: /root/.ssh/id_rsa
    enabled: false

  # CPU 负载监控（本机）
  - name: 服务器CPU
    type: cpu_load
    warn: 5
    crit: 10

  # CPU 负载监控（远程 - 密码认证）
  - name: 远程服务器CPU
    type: cpu_load
    host: 192.168.1.100
    warn: 5
    crit: 10
    ssh:
      user: root
      password: your_password

  # CPU 负载监控（远程 - 公钥认证）
  - name: 远程服务器CPU（密钥）
    type: cpu_load
    host: 192.168.1.100
    warn: 5
    crit: 10
    ssh:
      user: root
      key_file: /root/.ssh/id_rsa
    enabled: false

  # CPU 负载监控（远程 - 证书认证）
  - name: 远程服务器CPU（证书）
    type: cpu_load
    host: 192.168.1.100
    warn: 5
    crit: 10
    ssh:
      user: root
      key_file: /root/.ssh/id_ed25519
      cert_file: /root/.ssh/id_ed25519-cert.pub
    enabled: false

  # 内存监控
  - name: 服务器内存
    type: memory
    warn: 80
    crit: 90

  # 磁盘监控
  - name: 根分区
    type: disk
    path: /
    warn: 80
    crit: 90
    interval: 300
    alert_interval: 600

  # 进程监控
  - name: Nginx进程
    type: process
    process_name: nginx
    interval: 30
    alert_interval: 120

  # Docker容器监控
  - name: Redis容器
    type: container
    container_name: redis

# 通知渠道
notifiers:
  # 企业微信
  - name: 通知群
    type: wechat
    webhook: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_KEY

  # 企业微信应用消息
  - name: 运维通知
    type: wechat_app
    corp_id: YOUR_CORP_ID
    agent_id: YOUR_AGENT_ID
    secret: YOUR_SECRET
    to_users: "UserID1|UserID2"  # 多个用户用 | 分隔，@all 发送给所有人

  # 钉钉
  - name: 钉钉群
    type: dingtalk
    webhook: https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN

# 每日监控日报（cron 仅支持 "分 时 * * *"，发送到上面所有启用的通知渠道）
reporter:
  enabled: true
  cron: "30 9 * * *"    # 每天 09:30
  title: "监控日报"
  # targets 预留，当前统计全部监控项
  targets: []
